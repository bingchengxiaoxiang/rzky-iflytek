<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubuntu 22.04 命令行练习环境</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23300a24'/><text x='20' y='68' font-family='monospace' font-size='50' fill='%238ae234'>$_</text></svg>">
<style>
/* ===== 基础与配色（Ubuntu 终端风格） ===== */
:root{
  --term-bg:#300a24;          /* Ubuntu 默认终端背景 */
  --term-bg-2:#2a0920;
  --term-fg:#eeeeec;
  --term-dim:#999;
  --term-green:#8ae234;       /* 提示符用户 */
  --term-blue:#729fcf;         /* 提示符路径 */
  --term-red:#ef2929;
  --term-yellow:#fce94f;
  --term-cyan:#34e2e2;
  --term-magenta:#ad7fa8;
  --panel-bg:#1f1f1f;
  --panel-border:#3c3c3c;
  --panel-text:#d4d4d4;
  --accent:#e95420;            /* Ubuntu 橙 */
  --ok:#8ae234;
  --warn:#fce94f;
  --err:#ef2929;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Ubuntu Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
  background:#1a1a1a;
  color:var(--term-fg);
  font-size:14px;
  line-height:1.5;
}

/* ===== 整体布局 ===== */
.app{
  display:grid;
  grid-template-columns:1fr 320px;
  height:100vh;
  gap:0;
}
.app.no-side{grid-template-columns:1fr}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;right:0;top:0;bottom:0;width:85%;max-width:340px;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.5)}
}

/* ===== 终端窗口 ===== */
.terminal{
  display:flex;flex-direction:column;
  background:var(--term-bg);
  min-width:0;
}
.titlebar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  background:linear-gradient(#3c3c3c,#2a2a2a);
  border-bottom:1px solid #1a1a1a;
  user-select:none;
  flex-shrink:0;
}
.traffic{display:flex;gap:6px}
.traffic span{width:12px;height:12px;border-radius:50%;display:inline-block}
.traffic .r{background:#ff5f56}.traffic .y{background:#ffbd2e}.traffic .g{background:#27c93f}
.title{flex:1;text-align:center;color:#bbb;font-size:12px;font-weight:normal;letter-spacing:.5px}
.side-toggle{
  background:none;border:1px solid #555;color:#ccc;
  padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px;
  font-family:inherit;
}
.side-toggle:hover{background:#444}

/* ===== 终端输出区 ===== */
.screen{
  flex:1;overflow-y:auto;
  padding:12px 14px;
  cursor:text;
  white-space:pre-wrap;
  word-break:break-all;
}
.screen::-webkit-scrollbar{width:10px}
.screen::-webkit-scrollbar-track{background:transparent}
.screen::-webkit-scrollbar-thumb{background:#555;border-radius:5px}

/* 输出行样式 */
.line{white-space:pre-wrap;word-break:break-word}
.prompt-user{color:var(--term-green);font-weight:bold}
.prompt-path{color:var(--term-blue);font-weight:bold}
.prompt-sym{color:var(--term-fg)}
.cmd-echo{color:var(--term-fg)}
.out{color:var(--term-fg)}
.out-dim{color:var(--term-dim)}
.out-err{color:var(--term-red)}
.out-ok{color:var(--term-green)}
.out-warn{color:var(--term-yellow)}
.out-info{color:var(--term-cyan)}
.out-mag{color:var(--term-magenta)}
.ls-dir{color:var(--term-blue);font-weight:bold}
.ls-exe{color:var(--term-green)}
.ls-lnk{color:var(--term-cyan)}

/* 输入行 */
.input-line{display:flex;align-items:flex-start;}
.input-line .prompt{flex-shrink:0;white-space:nowrap}
.cmd-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--term-fg);font-family:inherit;font-size:inherit;
  padding:0;margin:0 0 0 6px;caret-color:var(--term-green);
  min-width:1ch;
}
@media (max-width:820px){
  .cmd-input{font-size:16px}
}

/* ===== 侧边栏：任务面板 ===== */
.sidebar{
  background:var(--panel-bg);
  border-left:1px solid var(--panel-border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.side-header{
  padding:14px 16px;
  border-bottom:1px solid var(--panel-border);
  flex-shrink:0;
}
.side-header h2{font-size:15px;color:#fff;font-weight:600;margin-bottom:4px}
.side-header p{font-size:12px;color:#999;line-height:1.4}
.progress-wrap{padding:10px 16px 0;flex-shrink:0}
.progress-bar{
  height:6px;background:#333;border-radius:3px;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--ok);width:0%;
  transition:width .4s ease;
}
.progress-text{font-size:11px;color:#999;margin-top:4px;text-align:right}

.task-list{
  flex:1;overflow-y:auto;
  padding:10px 0;
}
.task-list::-webkit-scrollbar{width:8px}
.task-list::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
.task{
  padding:10px 16px;
  border-left:3px solid transparent;
  cursor:pointer;
  transition:background .15s;
}
.task:hover{background:#2a2a2a}
.task.active{border-left-color:var(--accent);background:#262626}
.task.done{border-left-color:var(--ok)}
.task-num{
  font-size:11px;color:#888;letter-spacing:1px;
}
.task-title{font-size:13px;color:#e0e0e0;margin:2px 0}
.task.done .task-title{color:var(--ok);text-decoration:line-through;opacity:.7}
.task.active .task-title{color:#fff;font-weight:600}
.task-desc{font-size:11px;color:#999;margin-top:3px;line-height:1.5;display:none}
.task.active .task-desc{display:block}
.task-hint{
  margin-top:6px;padding:6px 8px;
  background:#1a1a1a;border-radius:4px;
  font-size:11px;color:var(--term-yellow);
  display:none;
  font-family:inherit;
}
.task.active .task-hint{display:block}

.side-footer{
  padding:10px 16px;
  border-top:1px solid var(--panel-border);
  font-size:11px;color:#888;
  flex-shrink:0;
}
.side-footer button{
  width:100%;margin-top:6px;
  background:var(--accent);color:#fff;border:none;
  padding:7px;border-radius:4px;cursor:pointer;
  font-family:inherit;font-size:12px;
}
.side-footer button:hover{background:#c94a1c}
.side-footer .reset{background:#444;margin-top:4px}
.side-footer .reset:hover{background:#555}

/* ===== 欢迎横幅 ===== */
.banner{color:var(--term-dim)}
.banner .b-strong{color:var(--term-cyan)}
.banner .b-warn{color:var(--term-yellow)}

/* 完成提示浮层 */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--ok);color:#000;
  padding:10px 20px;border-radius:6px;
  font-size:13px;font-weight:600;
  opacity:0;transition:all .3s;
  z-index:100;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 全屏欢迎提示 */
.welcome-box{
  padding:10px 0;
}
.welcome-box .row{margin:2px 0}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== 终端 ===== -->
  <div class="terminal">
    <div class="titlebar">
      <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <div class="title">student@ubuntu: ~</div>
      <button class="side-toggle" id="sideToggle" title="切换任务面板">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>任务
      </button>
    </div>
    <div class="screen" id="screen">
      <div id="output"></div>
      <div class="input-line" id="inputLine">
        <span class="prompt" id="prompt"></span>
        <input class="cmd-input" id="cmdInput" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
  </div>

  <!-- ===== 任务侧边栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-header">
      <h2>命令练习任务</h2>
      <p>完成下方任务，在终端中输入对应命令。输入 <span style="color:var(--term-yellow)">help</span> 查看可用命令。</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 8</div>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="side-footer">
      环境：Ubuntu 22.04.4 LTS (Jammy)<br>
      用户：student | Shell：bash
      <button id="resetBtn">重置练习环境</button>
      <button id="resetFsBtn" class="reset">恢复初始文件系统</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast">任务完成！</div>

<script>
/* ============================================================
 *  Ubuntu 22.04 离线命令练习环境
 *  纯前端实现，内存文件系统 + 命令解释器
 * ============================================================ */

/* ---------- 文件系统 ---------- */
// 节点：{type:'dir'|'file', children:{}, content:'', mode:'rwxr-xr-x', mtime:Date}
let FS, CWD, HISTORY, HIST_IDX;

function makeDir(children={}){
  return {type:'dir', children:children, mode:'drwxr-xr-x'};
}
function makeFile(content='', mode='-rw-r--r--'){
  return {type:'file', content:content, mode:mode};
}

function initFS(){
  FS = {
    type:'dir', children:{
      'home': makeDir({
        'student': makeDir({
          'Desktop': makeDir({}),
          'Documents': makeDir({
            'notes.txt': makeFile('Ubuntu 22.04 学习笔记\n===================\n\n1. 基本命令：ls cd pwd mkdir touch rm\n2. 查看文件：cat less head tail\n3. 搜索：grep find\n4. 权限：chmod\n\n提示：用 ls 查看目录内容。\n'),
            'report.pdf': makeFile('[二进制 PDF 文件]')
          }),
          'Downloads': makeDir({}),
          'Music': makeDir({}),
          'Pictures': makeDir({}),
          'Videos': makeDir({}),
          'practice': makeDir({
            'hello.sh': makeFile('#!/bin/bash\necho "Hello, Ubuntu 22.04!"\n', '-rw-r--r--'),
            'data.csv': makeFile('name,age,city\nAlice,23,Beijing\nBob,30,Shanghai\nCarol,28,Beijing\nDavid,35,Guangzhou\nEve,22,Shanghai\n'),
            'readme.md': makeFile('# 练习项目\n\n这是一个用于练习 Linux 命令的目录。\n请按右侧任务列表完成练习。\n'),
            'old_logs': makeDir({
              'log1.txt': makeFile('2026-01-10 系统启动完成\n2026-01-10 用户登录\n'),
              'log2.txt': makeFile('2026-01-11 定时任务执行\n2026-01-11 备份完成\n')
            })
          }),
          '.bashrc': makeFile('# ~/.bashrc\nexport PS1="\\u@\\h:\\w\\$ "\nalias ll="ls -alh"\nalas ..="cd .."\n')
        })
      }),
      'etc': makeDir({
        'hostname': makeFile('ubuntu\n'),
        'os-release': makeFile('PRETTY_NAME="Ubuntu 22.04.4 LTS"\nNAME="Ubuntu"\nVERSION_ID="22.04"\nVERSION="22.04.4 LTS (Jammy Jellyfish)"\nID=ubuntu\nID_LIKE=debian\nHOME_URL="https://www.ubuntu.com/"\n'),
        'passwd': makeFile('root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\nsys:x:3:3:sys:/dev:/usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\nstudent:x:1000:1000:Student User:/home/student:/bin/bash\n')
      }),
      'var': makeDir({
        'log': makeDir({
          'syslog': makeFile('Jan 1 00:00:01 ubuntu systemd[1]: Starting system activity accounting...\nJan 1 00:00:01 ubuntu CRON[1001]: pam_unix(cron:session): session opened\nJan 1 08:30:15 ubuntu sshd[2050]: Accepted password for student from 192.168.1.100 port 54321 ssh2\n')
        })
      }),
      'tmp': makeDir({}),
      'usr': makeDir({
        'bin': makeDir({}),
        'lib': makeDir({})
      })
    }
  };
  CWD = '/home/student';
  HISTORY = [];
  HIST_IDX = 0;
}

/* ---------- 路径解析 ---------- */
function splitPath(p){
  return p.split('/').filter(Boolean);
}
function resolvePath(p){
  if(!p) p = CWD;
  let base = p.startsWith('/') ? FS : getNode(CWD);
  let parts = splitPath(p.startsWith('/') ? p : CWD + '/' + p);
  let cur = FS;
  for(const part of parts){
    if(part === '.') continue;
    if(part === '..'){
      // 找到父节点：从根往下走
      cur = findParent(parts.slice(0, parts.indexOf(part)));
      continue;
    }
    if(cur.type !== 'dir' || !cur.children[part]) return null;
    cur = cur.children[part];
  }
  return cur;
}
// 简化：用绝对路径字符串解析
function resolveAbs(pathStr){
  if(!pathStr) pathStr = CWD;
  let abs;
  if(pathStr.startsWith('/')) abs = pathStr;
  else if(pathStr === '~' || pathStr.startsWith('~/')) abs = '/home/student' + pathStr.slice(1);
  else abs = CWD + '/' + pathStr;
  // 规范化 . 和 ..
  const parts = abs.split('/');
  const stack = [];
  for(const p of parts){
    if(p === '' || p === '.') continue;
    if(p === '..') stack.pop();
    else stack.push(p);
  }
  return '/' + stack.join('/');
}
function getNode(absPath){
  if(absPath === '/') return FS;
  const parts = splitPath(absPath);
  let cur = FS;
  for(const p of parts){
    if(cur.type !== 'dir' || !cur.children[p]) return null;
    cur = cur.children[p];
  }
  return cur;
}
function createPath(absPath, node){
  const parts = splitPath(absPath);
  let cur = FS;
  for(let i=0;i<parts.length-1;i++){
    const p = parts[i];
    if(!cur.children[p]) cur.children[p] = makeDir({});
    cur = cur.children[p];
  }
  cur.children[parts[parts.length-1]] = node;
}
function deletePath(absPath){
  if(absPath === '/') return false;
  const parts = splitPath(absPath);
  const parentAbs = '/' + parts.slice(0,-1).join('/');
  const parent = getNode(parentAbs);
  if(!parent || parent.type !== 'dir') return false;
  const name = parts[parts.length-1];
  if(!parent.children[name]) return false;
  delete parent.children[name];
  return true;
}
function basename(absPath){
  const parts = splitPath(absPath);
  return parts[parts.length-1] || '/';
}
function dirname(absPath){
  const parts = splitPath(absPath);
  parts.pop();
  return '/' + parts.join('/');
}

/* ---------- 终端输出 ---------- */
const output = document.getElementById('output');
const screen = document.getElementById('screen');
const promptEl = document.getElementById('prompt');
const input = document.getElementById('cmdInput');

function refreshPrompt(){
  const home = '/home/student';
  let display = CWD === home ? '~' : CWD.replace(home, '~');
  promptEl.innerHTML =
    '<span class="prompt-user">student@ubuntu</span>' +
    '<span class="prompt-sym">:</span>' +
    '<span class="prompt-path">' + display + '</span>' +
    '<span class="prompt-sym">$</span>';
  document.querySelector('.title').textContent = 'student@ubuntu: ' + display;
}

const inputLine = document.getElementById('inputLine');
function print(html, cls=''){
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = html;
  screen.insertBefore(div, inputLine);
  screen.scrollTop = screen.scrollHeight;
}
function printText(text, cls='out'){
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  print('<span class="'+cls+'">'+esc+'</span>');
}

/* ---------- 命令历史记录（回显） ---------- */
function echoCommand(cmd){
  const home = '/home/student';
  let display = CWD === home ? '~' : CWD.replace(home, '~');
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML =
    '<span class="prompt-user">student@ubuntu</span>' +
    '<span class="prompt-sym">:</span>' +
    '<span class="prompt-path">' + display + '</span>' +
    '<span class="prompt-sym">$ </span>' +
    '<span class="cmd-echo"></span>';
  div.querySelector('.cmd-echo').textContent = cmd;
  screen.insertBefore(div, inputLine);
}

/* ---------- 命令实现 ---------- */
const Commands = {
  help(args){
    printText('Ubuntu 22.04 离线练习环境 - 可用命令：\n', 'out-info');
    const rows = [
      ['pwd', '显示当前目录'],
      ['cd <目录>', '切换目录（cd .. 返回上级，cd ~ 回家）'],
      ['ls [-l] [-a]', '列出目录内容（-l 详细，-a 含隐藏文件）'],
      ['tree', '树形显示目录结构'],
      ['mkdir <目录>', '创建目录（支持 -p 递归创建）'],
      ['touch <文件>', '创建空文件'],
      ['rm <文件>', '删除（-r 删目录，-f 强制）'],
      ['cp <源> <目标>', '复制文件/目录（-r 递归）'],
      ['mv <源> <目标>', '移动或重命名'],
      ['cat <文件>', '查看文件全部内容'],
      ['head/tail <文件>', '查看文件开头/结尾（-n N）'],
      ['echo "文本" [> 文件]', '输出文本，> 重定向写入文件'],
      ['grep "关键词" <文件>', '在文件中搜索'],
      ['find <路径> -name "<名>"', '按名称查找文件'],
      ['wc <文件>', '统计行/词/字节数'],
      ['chmod +x <文件>', '添加执行权限'],
      ['whoami / hostname', '当前用户 / 主机名'],
      ['date / uname -a', '日期 / 系统信息'],
      ['df -h / free -h', '磁盘 / 内存使用'],
      ['ps', '查看进程'],
      ['history', '命令历史'],
      ['clear', '清屏'],
      ['tree / pwd / ls -la', '探索这个文件系统吧'],
    ];
    let maxLen = 0;
    rows.forEach(r=>maxLen = Math.max(maxLen, r[0].length));
    rows.forEach(r=>{
      const pad = r[0].padEnd(maxLen+2, ' ');
      printText('  '+pad+r[1], 'out');
    });
    printText('\n提示：按 ↑ ↓ 翻阅历史命令，按 Tab 补全。', 'out-dim');
  },

  pwd(args){ printText(CWD); },

  cd(args){
    let target = args[0] || '~';
    const abs = resolveAbs(target);
    const node = getNode(abs);
    if(!node){ printText('bash: cd: '+target+': 没有那个文件或目录', 'out-err'); return; }
    if(node.type !== 'dir'){ printText('bash: cd: '+target+': 不是目录', 'out-err'); return; }
    CWD = abs;
    refreshPrompt();
    checkTask('cd');
  },

  ls(args){
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const targetArg = args.find(a=>!a.startsWith('-'));
    const abs = resolveAbs(targetArg || '.');
    const node = getNode(abs);
    if(!node){ printText('ls: 无法访问 \''+(targetArg||'.')+'\': 没有那个文件或目录', 'out-err'); return; }
    if(node.type === 'file'){ printText(basename(abs)); return; }
    const showAll = flags.includes('a');
    const longFmt = flags.includes('l');
    let names = Object.keys(node.children);
    if(!showAll) names = names.filter(n=>!n.startsWith('.'));
    names.sort();
    if(names.length === 0){ printText(''); return; }
    if(longFmt){
      printText('总用量 '+names.length, 'out-dim');
      names.forEach(n=>{
        const c = node.children[n];
        const type = c.type==='dir' ? 'd' : (c.mode.startsWith('-rwx')||c.mode.includes('x') ? '-' : '-');
        const isDir = c.type==='dir';
        const isExe = c.mode.includes('x');
        const cls = isDir ? 'ls-dir' : (isExe ? 'ls-exe' : 'out');
        printText(c.mode+'  student student  '+String(n===n).padStart(4,' ')+'  '+(isDir?'':'')+n+(isDir?'/':''), cls);
      });
    } else {
      names.forEach(n=>{
        const c = node.children[n];
        const isDir = c.type==='dir';
        const isExe = c.mode.includes('x');
        const cls = isDir ? 'ls-dir' : (isExe ? 'ls-exe' : 'out');
        printText(n + (isDir?'/':'') + '    ', cls);
      });
    }
    checkTask('ls');
  },

  tree(args){
    function walk(node, prefix){
      const keys = Object.keys(node.children).sort();
      keys.forEach((k,i)=>{
        const last = i === keys.length-1;
        const c = node.children[k];
        const branch = last ? '└── ' : '├── ';
        const cls = c.type==='dir' ? 'ls-dir' : 'out';
        printText(prefix + branch + k + (c.type==='dir'?'/':''), cls);
        if(c.type==='dir') walk(c, prefix + (last?'    ':'│   '));
      });
    }
    const abs = resolveAbs(args[0]||'.');
    const node = getNode(abs);
    if(!node){ printText('tree: 目录不存在', 'out-err'); return; }
    printText(basename(abs) + (node.type==='dir'?'/':''), 'ls-dir');
    if(node.type==='dir') walk(node, '');
  },

  mkdir(args){
    const parenth = args.includes('-p');
    const targets = args.filter(a=>!a.startsWith('-'));
    if(targets.length===0){ printText('mkdir: 缺少操作数', 'out-err'); return; }
    targets.forEach(t=>{
      const abs = resolveAbs(t);
      if(getNode(abs)){ printText('mkdir: 无法创建目录 \''+t+'\': 文件已存在', 'out-err'); return; }
      if(parenth){
        // 递归创建
        const parts = splitPath(abs);
        let cur = FS;
        let ok = true;
        for(const p of parts){
          if(!cur.children[p]) cur.children[p] = makeDir({});
          cur = cur.children[p];
          if(cur.type !== 'dir'){ ok=false; break; }
        }
        if(!ok) printText('mkdir: 路径冲突', 'out-err');
      } else {
        const parent = getNode(dirname(abs));
        if(!parent){ printText('mkdir: 无法创建目录 \''+t+'\': 没有那个文件或目录', 'out-err'); return; }
        parent.children[basename(abs)] = makeDir({});
      }
    });
    checkTask('mkdir');
  },

  touch(args){
    const targets = args.filter(a=>!a.startsWith('-'));
    if(targets.length===0){ printText('touch: 缺少文件操作数', 'out-err'); return; }
    targets.forEach(t=>{
      const abs = resolveAbs(t);
      if(!getNode(abs)){
        const parent = getNode(dirname(abs));
        if(!parent){ printText('touch: 无法触碰 \''+t+'\': 没有那个文件或目录', 'out-err'); return; }
        parent.children[basename(abs)] = makeFile('');
      }
    });
    checkTask('touch');
  },

  rm(args){
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const recursive = flags.includes('r');
    const targets = args.filter(a=>!a.startsWith('-'));
    if(targets.length===0){ printText('rm: 缺少操作数', 'out-err'); return; }
    targets.forEach(t=>{
      const abs = resolveAbs(t);
      const node = getNode(abs);
      if(!node){ printText('rm: 无法删除 \''+t+'\': 没有那个文件或目录', 'out-err'); return; }
      if(node.type==='dir' && !recursive){
        printText('rm: 无法删除 \''+t+'\': 是一个目录', 'out-err');
        return;
      }
      deletePath(abs);
    });
    checkTask('rm');
  },

  cp(args){
    const recursive = args.includes('-r');
    const rest = args.filter(a=>!a.startsWith('-'));
    if(rest.length<2){ printText('cp: 缺少目标文件操作数', 'out-err'); return; }
    const srcAbs = resolveAbs(rest[0]);
    const dstAbs = resolveAbs(rest[rest.length-1]);
    const src = getNode(srcAbs);
    if(!src){ printText('cp: 无法读取 \''+rest[0]+'\': 没有那个文件或目录', 'out-err'); return; }
    let dstNode = getNode(dstAbs);
    let finalName = basename(srcAbs);
    let dstParentAbs;
    if(dstNode && dstNode.type==='dir'){
      dstParentAbs = dstAbs;
    } else {
      dstParentAbs = dirname(dstAbs);
      finalName = basename(dstAbs);
    }
    const dstParent = getNode(dstParentAbs);
    if(!dstParent){ printText('cp: 目标目录不存在', 'out-err'); return; }
    function clone(n){
      if(n.type==='file') return makeFile(n.content, n.mode);
      const d = makeDir({});
      for(const k in n.children) d.children[k] = clone(n.children[k]);
      return d;
    }
    dstParent.children[finalName] = clone(src);
    checkTask('cp');
  },

  mv(args){
    const rest = args.filter(a=>!a.startsWith('-'));
    if(rest.length<2){ printText('mv: 缺少目标文件操作数', 'out-err'); return; }
    const srcAbs = resolveAbs(rest[0]);

    const src = getNode(srcAbs);

    let dstNode = getNode(dstAbs);
    let finalName = basename(srcAbs);

    } else {
      dstParentAbs = dirname(dstAbs);
      finalName = basename(dstAbs);
    }
    const dstParent = getNode(dstParentAbs);
    if(!dstParent){ printText('mv: 目标目录不存在', 'out-err'); return; }
    dstParent.children[finalName] = src;
    deletePath(srcAbs);

  echo(args, rawCmd){

    if(redirectMatch){
      const text = redirectMatch[2] !== undefined ? redirectMatch[2] : redirectMatch[3];

      const abs = resolveAbs(file);
      const parent = getNode(dirname(abs));

    text = text.replace(/^["']|["']$/g,'');

  head(args){

    const nIdx = args.indexOf('-n');
    if(nIdx>=0 && args[nIdx+1]){ n = parseInt(args[nIdx+1])||10; }
    const fileArg = args.find(a=>!a.startsWith('-') && a !== String(n));

  tail(args){

  grep(args){
    const rest = args.filter(a=>!a.startsWith('-'));
    if(rest.length<2){ printText('用法: grep "关键词" 文件', 'out-err'); return; }
    const pattern = rest[0];
    const files = rest.slice(1);
    files.forEach(f=>{
      const node = getNode(resolveAbs(f));
      if(!node || node.type!=='file'){ printText('grep: '+f+': 没有那个文件', 'out-err'); return; }
      node.content.split('\n').forEach((line,i)=>{
        if(line.includes(pattern)){
          printText(f+':'+line, 'out-info');
        }
      });
    });
    checkTask('grep');
  },

  find(args){
    const nameIdx = args.indexOf('-name');
    if(nameIdx<0 || !args[nameIdx+1]){
      printText('用法: find <路径> -name "文件名"', 'out-err');
      return;
    }
    const pattern = args[nameIdx+1].replace(/\*/g,'.*').replace(/\?/g,'.');
    const pathArg = args.find(a=>!a.startsWith('-') && args.indexOf(a)!==nameIdx+1);
    const abs = resolveAbs(pathArg||'.');
    const root = getNode(abs);
    if(!root){ printText('find: 路径不存在', 'out-err'); return; }
    const re = new RegExp('^'+pattern+'$');
    function walk(node, path){
      for(const k in node.children){
        const c = node.children[k];
        const full = path + '/' + k;
        if(re.test(k)) printText(full);
        if(c.type==='dir') walk(c, full);
      }
    }
    walk(root, abs==='/'?'':abs);
  },

  wc(args){
    const fileArg = args.find(a=>!a.startsWith('-'));
    if(!fileArg){ printText('wc: 缺少文件', 'out-err'); return; }
    const node = getNode(resolveAbs(fileArg));
    if(!node || node.type!=='file'){ printText('wc: '+fileArg+': 文件不存在', 'out-err'); return; }
    const lines = node.content.split('\n').length;
    const words = node.content.split(/\s+/).filter(Boolean).length;
    const bytes = node.content.length;
    printText('  '+lines+'  '+words+'  '+bytes+'  '+fileArg);
  },

  chmod(args){

    const mode = rest[0];

let taskProgress = {}; // id -> true/false

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  TASKS.forEach((t,i)=>{
    const done = taskProgress[t.id];
    const div = document.createElement('div');
    div.className = 'task' + (done?' done':'') + (i===currentTaskIdx?' active':'');
    div.innerHTML =
      '<div class="task-num">任务 '+(i+1)+' / '+TASKS.length+(done?'  ✓':'')+'</div>' +
      '<div class="task-title">'+t.title+'</div>' +
      '<div class="task-desc">'+t.desc+'</div>' +

  });

}

let currentTaskIdx = 0;
function checkTask(cmdName){
  // 找到下一个未完成任务，看是否匹配
  for(let i=0;i<TASKS.length;i++){
    const t = TASKS[i];
    if(taskProgress[t.id]) continue;
    if(t.check.cmds.includes(cmdName)){
      taskProgress[t.id] = true;
      currentTaskIdx = i+1;
      showToast('任务完成：'+t.title);
      renderTasks();
      printText('  [✓] 任务完成：'+t.title, 'out-ok');
      if(currentTaskIdx < TASKS.length){
        printText('  [>] 下一个任务：'+TASKS[currentTaskIdx].title+' — '+TASKS[currentTaskIdx].desc, 'out-info');
      } else {
        printText('  ★ 恭喜！所有练习任务已完成！★', 'out-ok');
      }
      break;
    }
  }
}

/* ---------- 命令执行 ---------- */
function execute(rawCmd){
  rawCmd = rawCmd.trim();
  if(!rawCmd) return;
  HISTORY.push(rawCmd);
  HIST_IDX = HISTORY.length;

  echoCommand(rawCmd);

  // 解析命令
  // 先处理重定向（在 echo 里特殊处理，其它命令忽略 > 后面）
  let cmdStr = rawCmd;
  const parts = tokenize(cmdStr);
  const cmd = parts[0];
  const args = parts.slice(1);

  if(Commands[cmd]){
    try{
      Commands[cmd](args, rawCmd);
    }catch(e){
      printText('错误: '+e.message, 'out-err');
    }
  } else {
    printText(cmd+': 命令未找到。输入 help 查看可用命令。', 'out-err');
  }
  screen.scrollTop = screen.scrollHeight;
}

function tokenize(s){
  const result = [];
  const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    result.push(m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3]));
  }
  return result;
}

/* ---------- 输入事件 ---------- */
input.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const v = input.value;
    input.value = '';
    execute(v);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(HISTORY.length > 0){
      HIST_IDX = Math.max(0, HIST_IDX-1);
      input.value = HISTORY[HIST_IDX] || '';
    }
  } else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(HISTORY.length > 0){
      HIST_IDX = Math.min(HISTORY.length, HIST_IDX+1);
      input.value = HISTORY[HIST_IDX] || '';
    }
  } else if(e.key === 'Tab'){
    e.preventDefault();
    doTabComplete();
  } else if(e.key === 'l' && e.ctrlKey){
    e.preventDefault();
    Commands.clear();
  } else if(e.key === 'c' && e.ctrlKey){
    e.preventDefault();
    printText(input.value, 'out-dim');
    input.value = '';
    echoCommand('');
  }
});

function doTabComplete(){
  const v = input.value;
  const parts = v.split(/\s+/);
  if(parts.length <= 1){
    // 补全命令名
    const prefix = parts[0] || '';
    const matches = Object.keys(Commands).filter(c=>c.startsWith(prefix));
    if(matches.length === 1){
      input.value = matches[0] + ' ';
    } else if(matches.length > 1){
      echoCommand(v);
      printText(matches.join('   '), 'out-info');
      refreshPrompt();
      // 重新显示当前输入
      const line = document.getElementById('inputLine');
      line.querySelector('.cmd-echo, .cmd-input') && refreshPrompt();
      input.value = v;
    }
  } else {
    // 补全路径
    const last = parts[parts.length-1];
    const abs = resolveAbs(last);
    const parent = getNode(dirname(abs));
    const base = basename(abs);
    if(parent && parent.type==='dir'){
      const matches = Object.keys(parent.children).filter(n=>n.startsWith(base));
      if(matches.length === 1){
        parts[parts.length-1] = last.includes('/') ? last.slice(0, last.lastIndexOf('/')+1) + matches[0] : matches[0];
        if(parent.children[matches[0]].type==='dir') parts[parts.length-1] += '/';
        input.value = parts.join(' ');
      } else if(matches.length > 1){
        echoCommand(v);
        printText(matches.join('   '), 'ls-dir');
        input.value = v;
      }
    }
  }
}

document.getElementById('screen').addEventListener('click', ()=>input.focus());

/* ---------- 侧边栏切换 / 重置 ---------- */
document.getElementById('sideToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  taskProgress = {};
  currentTaskIdx = 0;
  renderTasks();
  printText('--- 任务进度已重置 ---', 'out-warn');
});
document.getElementById('resetFsBtn').addEventListener('click', ()=>{
  resetFS();
  printText('--- 文件系统已恢复初始状态 ---', 'out-warn');
});

function resetFS(){
  initFS();
  refreshPrompt();
}

/* ---------- 启动横幅 ---------- */
function welcome(){
  printText('Welcome to Ubuntu 22.04.4 LTS (Jammy Jellyfish) — 离线练习环境', 'banner');
  printText('', '');
  printText('  System information:', 'b-strong');
  printText('    OS:       Ubuntu 22.04.4 LTS x86_64', 'out');
  printText('    Kernel:   5.15.0-91-generic', 'out');
  printText('    User:     student (uid=1000)', 'out');
  printText('    Shell:    bash 5.1.16', 'out');
  printText('', '');
  printText('  输入 help 查看所有可用命令。', 'b-warn');
  printText('  右侧任务面板列出了 11 个练习任务，跟着完成即可掌握基本命令。', 'out');
  printText('', '');
}

initFS();
refreshPrompt();
welcome();
renderTasks();
input.focus();
